# Cryptika Messenger — Gradle Properties
# ----------------------------------------
# Project-wide Gradle settings.
# JVM heap: 2 GB keeps large Kotlin/Compose compilations from OOM-ing.
# AndroidX + Jetifier: required for Jetpack Compose and Hilt DI.
# Gradle build cache: speeds up incremental builds significantly.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
org.gradle.caching=true
android.builder.sdkDownload=true
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.http.connectionTimeout=180000
