# Cryptika Relay Server — Docker Compose
# ----------------------------------------
# Spins up the blind relay server that routes encrypted packets between clients.
# The server never inspects message content — it only routes ciphertext.
#
# Usage:
#   docker-compose up -d        # start in background
#   docker-compose logs -f      # follow logs
#   docker-compose down         # stop and remove containers
#
# Configuration:
#   Copy .env.example to .env and populate with secure random keys:
#     cp .env.example .env
#   Generate 64-character (32-byte) hex keys using OpenSSL:
#     openssl rand -hex 32
#
# To persist the server Ed25519 signing keypair and secrets across restarts, set:
#   HMAC_SECRET_HEX=<64-char hex>
#   JWT_SECRET_HEX=<64-char hex>
#   SERVER_PRIVATE_KEY_HEX=<64-char hex>

version: '3.8'

services:
  cryptika-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cryptika-relay-server
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=8443
      - HMAC_SECRET_HEX=${HMAC_SECRET_HEX}
      - JWT_SECRET_HEX=${JWT_SECRET_HEX}
      - SERVER_PRIVATE_KEY_HEX=${SERVER_PRIVATE_KEY_HEX}
    volumes:
      # Optional: Mount volume to persist server keys
      - server-data:/usr/src/app/data
    networks:
      - cryptika-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8443/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  server-data:
    driver: local

networks:
  cryptika-network:
    driver: bridge
